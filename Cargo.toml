[workspace]
resolver = "3"
members = ["crates/*", "vendor/gpui_macos"]
default-members = ["crates/*"]
# Vendored gpui (Blink pixel snapping) and gpui_apple (Skia glyph blend); used through
# [patch], not members. Vendored rrule 0.14.0 (original recurrence limits) is a path dependency.
# The macOS platform is a member so its native payload tests can run.
exclude = ["crates/textsys/gpui", "crates/textsys/gpui_apple", "vendor/rrule", "vendor/tungstenite"]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
anyhow = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
# gpui from zed main: needed for `HeadlessAppContext` + Metal `render_to_image` (not in gpui 0.2.2).
gpui = { git = "https://github.com/zed-industries/zed", rev = "3e145061d861ed32bb6a08dad7b03f2b5e455ad8" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "3e145061d861ed32bb6a08dad7b03f2b5e455ad8", default-features = false, features = ["font-kit"] }

# Same forks zed's own workspace patches in; gpui is built against them.
[patch.crates-io]
async-process = { git = "https://github.com/zed-industries/async-process.git", rev = "0b6d6713570af61806e1e5cb40e0f757cb93fd9d" }
async-task = { git = "https://github.com/zed-industries/async-task.git", rev = "015845a19fc31752c02367567d3b8900a406f9da" }
calloop = { git = "https://github.com/zed-industries/calloop", rev = "3759371fee14c40066d64777e2a36b6ffcc22590" }

# Chromium-exact layout snapping and glyph blending (see crates/textsys).
[patch."https://github.com/zed-industries/zed"]
gpui = { path = "crates/textsys/gpui" }
gpui_apple = { path = "crates/textsys/gpui_apple" }
gpui_macos = { path = "vendor/gpui_macos" }

[profile.dev]
debug = "limited"
