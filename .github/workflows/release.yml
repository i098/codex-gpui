name: release
# A `vMAJOR.MINOR.PATCH` tag on a merged `tools/version.sh` bump publishes the universal (arm64 + x86_64) macOS zip, the Linux .deb and the Windows MSIX.
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    # Creates the release so each platform job below only uploads to it. GitHub-hosted macOS and
    # Windows runners are not available to this private repository; the Linux job runs on ours.
    runs-on: codex-gpui
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Install the GitHub CLI
        run: command -v gh >/dev/null || { sudo apt-get update && sudo apt-get install -y --no-install-recommends gh; }
      - uses: actions/checkout@v4
      - name: Create the release
        run: |
          version=$(tools/version.sh)
          [[ $GITHUB_REF_NAME == "v$version" ]] || { echo "tag $GITHUB_REF_NAME is not v$version" >&2; exit 1; }
          awk -v heading="## [$version]" 'index($0, heading) == 1 { found = 1; next } found && /^## \[/ { exit } found' CHANGELOG.md >notes.md
          gh release create "$GITHUB_REF_NAME" --title "Codex GPUI $version" --notes-file notes.md --verify-tag
  macos:
    needs: release
    runs-on: macos-14
    env:
      CODEX_GPUI_UNIVERSAL: "1"
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      GH_TOKEN: ${{ github.token }}
      # With SPARKLE_ED_PRIVATE_KEY and SPARKLE_ED_PUBLIC_KEY set, the zip
      # embeds the update feed and the release also publishes appcast.xml; without them it ships no feed. With no CODEX_GPUI_SIGN_IDENTITY the bundle is signed ad hoc.
      SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
      SPARKLE_ED_PUBLIC_KEY: ${{ secrets.SPARKLE_ED_PUBLIC_KEY }}
      CODEX_GPUI_SIGN_IDENTITY: ${{ secrets.CODEX_GPUI_SIGN_IDENTITY }}
      # With the Developer ID certificate (base64 .p12 and its password) the bundle is signed with the
      # hardened runtime; with the App Store Connect API key it is also notarized and stapled.
      MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      CODEX_GPUI_NOTARY_KEY_P8: ${{ secrets.CODEX_GPUI_NOTARY_KEY_P8 }}
      CODEX_GPUI_NOTARY_KEY_ID: ${{ secrets.CODEX_GPUI_NOTARY_KEY_ID }}
      CODEX_GPUI_NOTARY_ISSUER: ${{ secrets.CODEX_GPUI_NOTARY_ISSUER }}
      CODEX_GPUI_DMG: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag matches the workspace version
        run: |
          version=$(tools/version.sh)
          [[ $GITHUB_REF_NAME == "v$version" ]] || { echo "tag $GITHUB_REF_NAME is not v$version" >&2; exit 1; }
          echo "VERSION=$version" >>"$GITHUB_ENV"
      - name: Add the Intel Rust target
        run: rustup target add x86_64-apple-darwin aarch64-apple-darwin
      - name: Fetch Sparkle
        if: ${{ env.SPARKLE_ED_PRIVATE_KEY != '' }}
        run: |
          curl -fsSL -o /tmp/sparkle.tar.xz https://github.com/sparkle-project/Sparkle/releases/download/2.9.0/Sparkle-2.9.0.tar.xz
          echo '01e0f0ebf6614061ea816d414de50f937d64ffa6822ad572243031ca3676fe19  /tmp/sparkle.tar.xz' | shasum -a 256 -c -
          mkdir /tmp/sparkle && tar -xf /tmp/sparkle.tar.xz -C /tmp/sparkle
          echo "CODEX_GPUI_SPARKLE_FRAMEWORK=/tmp/sparkle/Sparkle.framework" >>"$GITHUB_ENV"
          echo "CODEX_GPUI_UPDATE_PUBLIC_KEY=$SPARKLE_ED_PUBLIC_KEY" >>"$GITHUB_ENV"
          echo "CODEX_GPUI_UPDATE_FEED=https://github.com/$GITHUB_REPOSITORY/releases/latest/download/appcast.xml" >>"$GITHUB_ENV"
      - name: Import the Developer ID certificate
        if: ${{ env.MACOS_CERTIFICATE_P12 != '' }}
        run: |
          keychain=$RUNNER_TEMP/release.keychain-db
          password=$(uuidgen)
          echo "$MACOS_CERTIFICATE_P12" | base64 --decode >"$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain-db
          rm "$RUNNER_TEMP/certificate.p12"
      - name: Build, sign and verify the bundle
        run: bash tools/bundle.sh --assemble /tmp/codex-gpui-release normal "$GITHUB_SHA" archive
      - name: Publish the release
        run: |
          zip=codex-gpui-$VERSION-macos-universal.zip
          mv /tmp/codex-gpui-release/bundle.zip "$zip"
          assets=("$zip")
          if [[ -f /tmp/codex-gpui-release/bundle.dmg ]]; then
              dmg=codex-gpui-$VERSION-macos.dmg
              mv /tmp/codex-gpui-release/bundle.dmg "$dmg"
              assets+=("$dmg")
          fi
          if [[ -n $SPARKLE_ED_PRIVATE_KEY ]]; then
              python3 tools/appcast.py "$zip" --tag "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --sign-update /tmp/sparkle/bin/sign_update --out feed
              (cd feed && ln -s "../$zip" . && shasum -a 256 -c "$zip.sha256" && rm "$zip")
              assets+=(feed/appcast.xml "feed/$zip.sha256")
          fi
          gh release upload "$GITHUB_REF_NAME" "${assets[@]}"
  windows:
    needs: release
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
      # With WINDOWS_SIGN_PFX_BASE64, WINDOWS_SIGN_PFX_PASSWORD and WINDOWS_MSIX_PUBLISHER (the
      # certificate subject) set, the MSIX is signed; without them it ships unsigned.
      CODEX_GPUI_SIGN_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGN_PFX_PASSWORD }}
      CODEX_GPUI_MSIX_PUBLISHER: ${{ secrets.WINDOWS_MSIX_PUBLISHER }}
      PFX_BASE64: ${{ secrets.WINDOWS_SIGN_PFX_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Decode the signing certificate
        if: ${{ env.PFX_BASE64 != '' }}
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'codex-gpui.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:PFX_BASE64))
          "CODEX_GPUI_SIGN_PFX=$pfx" >> $env:GITHUB_ENV
      - name: Build the MSIX
        shell: pwsh
        run: tools/package-windows.ps1 dist
      - name: Attach it to the release
        run: gh release upload "$GITHUB_REF_NAME" dist/*.msix
  linux-x86_64:
    # The AppImage self-updates from latest.json, which is signed with an Ed25519 key.
    # Without the three secrets below the release ships no Linux build.
    needs: release
    runs-on: codex-gpui
    env:
      GH_TOKEN: ${{ github.token }}
      CODEX_GPUI_UPDATE_PRIVATE_KEY: ${{ secrets.CODEX_GPUI_UPDATE_PRIVATE_KEY }}
      CODEX_GPUI_UPDATE_PUBLIC_KEY: ${{ secrets.CODEX_GPUI_UPDATE_PUBLIC_KEY }}
      # The self-hosted runner has no FUSE device, so appimagetool unpacks itself and runs from there.
      APPIMAGE_EXTRACT_AND_RUN: "1"
    steps:
      - name: Install the GitHub CLI
        run: command -v gh >/dev/null || { sudo apt-get update && sudo apt-get install -y --no-install-recommends gh; }
      - uses: actions/checkout@v4
      - name: Check the signing key is configured
        id: gate
        run: '[[ -n $CODEX_GPUI_UPDATE_PRIVATE_KEY && -n $CODEX_GPUI_UPDATE_PUBLIC_KEY ]] && echo run=1 >>"$GITHUB_OUTPUT" || echo "no update signing key; skipping the Linux build"'
      - if: steps.gate.outputs.run
        run: >
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          build-essential pkg-config clang cmake libssl-dev libzstd-dev
          libfontconfig-dev libfreetype-dev libasound2-dev libxkbcommon-dev
          libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev libxcb1-dev
          libvulkan-dev libfuse2t64 xxd fakeroot file
      - if: steps.gate.outputs.run
        uses: dtolnay/rust-toolchain@stable
      - if: steps.gate.outputs.run
        name: Build the AppImage and sign the manifest
        env:
          CODEX_GPUI_UPDATE_FEED: https://github.com/${{ github.repository }}/releases/latest/download/latest.json
        run: |
          version=$(tools/version.sh)
          [[ $GITHUB_REF_NAME == "v$version" ]] || { echo "tag $GITHUB_REF_NAME is not v$version" >&2; exit 1; }
          cargo build --release -p app --bin codex-gpui
          curl -fsSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          sudo mv appimagetool /usr/local/bin/appimagetool
          appimage=codex-gpui-$version-x86_64.AppImage
          tools/appimage.sh target/release/codex-gpui "$appimage"
          tools/linux-manifest.sh "$appimage" "$version" "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/$appimage" latest.json
          gh release upload "$GITHUB_REF_NAME" "$appimage" latest.json
      - if: steps.gate.outputs.run
        name: Build the .deb and attach it
        run: |
          FORMATS=deb tools/package-linux.sh dist
          gh release upload "$GITHUB_REF_NAME" dist/*.deb
