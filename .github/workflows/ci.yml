name: ci
on:
  push:
    branches: [main]
  pull_request:
    # ready_for_review starts the run that a draft skipped.
    types: [opened, synchronize, reopened, ready_for_review]
# A new push to a PR cancels its older run; each main push keeps its own group, so none is cancelled.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.sha }}
  cancel-in-progress: true
jobs:
  rust:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: [self-hosted, codex-gpui]
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - run: >
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          build-essential pkg-config clang cmake libssl-dev libzstd-dev
          libfontconfig-dev libfreetype-dev libasound2-dev libxkbcommon-dev
          libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev libxcb1-dev
          libvulkan-dev
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # main has no Cargo workspace yet; the checks start once Cargo.toml lands.
      - if: hashFiles('Cargo.toml') != ''
        run: cargo fmt --check
      - if: hashFiles('Cargo.toml') != ''
        run: cargo clippy --workspace --all-targets -- -D warnings
      - if: hashFiles('Cargo.toml') != ''
        run: cargo test --workspace
      - name: Remove job-owned Cargo target
        if: always()
        run: rm -rf -- "$CARGO_TARGET_DIR"
