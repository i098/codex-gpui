name: ci
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    # ready_for_review starts the run that a draft skipped.
    types: [opened, synchronize, reopened, ready_for_review]
    # A PR that changes only these documentation files starts no run; any other file starts it.
    # No build reads them: the gpui crate doc includes crates/textsys/gpui/README.md, not the
    # root README.md, and the vendored CHANGELOG.md is outside this list.
    paths-ignore:
      - README.md
      - CHANGELOG.md
      - CONTRIBUTING.md
      - .github/SECURITY.md
      - .github/PULL_REQUEST_TEMPLATE.md
      - .github/ISSUE_TEMPLATE/**
      - docs/*.md
# A new push to a PR cancels its older run; every other run keys on its commit and is never cancelled.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  quick:
    runs-on: [self-hosted, codex-gpui-quick]
    timeout-minutes: 30
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      # Local-disk sccache on the runner; no network backend.
      RUSTC_WRAPPER: sccache
      SCCACHE_DIR: /var/cache/sccache-codex-gpui
    steps:
      - run: >
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          build-essential pkg-config clang cmake libssl-dev libzstd-dev
          libfontconfig-dev libfreetype-dev libasound2-dev libxkbcommon-dev
          libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev libxcb1-dev
          libvulkan-dev xvfb
      - uses: taiki-e/install-action@sccache
      - run: sudo mkdir -p "$SCCACHE_DIR" && sudo chown "$(id -u):$(id -g)" "$SCCACHE_DIR"
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - if: hashFiles('Cargo.toml') != ''
        run: cargo fmt --check
      - if: hashFiles('Cargo.toml') != ''
        run: cargo check --workspace --all-targets
      - name: Remove Cargo target files
        if: always()
        run: rm -rf -- "$CARGO_TARGET_DIR"
  rust:
    if: ${{ github.event_name == 'workflow_dispatch' || !github.event.pull_request.draft }}
    runs-on: [self-hosted, codex-gpui]
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      # Local-disk sccache on the runner; no network backend.
      RUSTC_WRAPPER: sccache
      SCCACHE_DIR: /var/cache/sccache-codex-gpui
    steps:
      - run: >
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          build-essential pkg-config clang cmake libssl-dev libzstd-dev
          libfontconfig-dev libfreetype-dev libasound2-dev libxkbcommon-dev
          libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev libxcb1-dev
          libvulkan-dev xvfb
      - uses: taiki-e/install-action@sccache
      - run: sudo mkdir -p "$SCCACHE_DIR" && sudo chown "$(id -u):$(id -g)" "$SCCACHE_DIR"
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # main has no Cargo workspace yet; the checks start once Cargo.toml lands.
      - if: hashFiles('Cargo.toml') != ''
        run: cargo fmt --check
      - if: hashFiles('Cargo.toml') != ''
        run: cargo clippy --workspace --all-targets -- -D warnings
      - if: hashFiles('Cargo.toml') != ''
        uses: taiki-e/install-action@nextest
      # nextest does not run doctests; --retries 1 absorbs a timing flake once.
      - if: hashFiles('Cargo.toml') != ''
        run: cargo nextest run --workspace --retries 1
      - if: hashFiles('Cargo.toml') != ''
        run: cargo test --workspace --doc
      # The primary window must open on the X11 backend: timeout (124) means it stayed up.
      - if: hashFiles('Cargo.toml') != ''
        name: Smoke-open the primary window
        run: |
          cargo build -p app
          rc=0
          stub=$(mktemp -d)
          printf '#!/bin/sh\nexec sleep 3600\n' >"$stub/codex"
          chmod +x "$stub/codex"
          HOME=$(mktemp -d) PATH="$stub:$PATH" timeout 20 xvfb-run -a "$CARGO_TARGET_DIR/debug/codex-gpui" || rc=$?
          [[ $rc -eq 124 ]] || { echo "window did not stay open (exit $rc)" >&2; exit 1; }
      - name: Remove Cargo target files
        if: always()
        run: rm -rf -- "$CARGO_TARGET_DIR"
