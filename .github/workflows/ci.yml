name: ci
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    # ready_for_review starts the run that a draft skipped.
    types: [opened, synchronize, reopened, ready_for_review]
    # A PR that changes only these documentation files starts no run; any other file starts it.
    # No build reads them: the gpui crate doc includes crates/textsys/gpui/README.md, not the
    # root README.md, and the vendored CHANGELOG.md is outside this list.
    paths-ignore:
      - README.md
      - CHANGELOG.md
      - CONTRIBUTING.md
      - .github/SECURITY.md
      - .github/PULL_REQUEST_TEMPLATE.md
      - .github/ISSUE_TEMPLATE/**
      - docs/*.md
# A new push to a PR cancels its older run; every other run keys on its commit and is never cancelled.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  quick:
    runs-on: codex-gpui-quick
    timeout-minutes: 30
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      # The runner containers start empty, so a local-disk sccache never hit; use the GitHub cache.
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - run: >
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          build-essential pkg-config clang cmake libssl-dev libzstd-dev
          libfontconfig-dev libfreetype-dev libasound2-dev libxkbcommon-dev
          libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev libxcb1-dev
          libvulkan-dev xvfb
      - uses: mozilla-actions/sccache-action@v0.0.11
      # A slow or unreachable GitHub cache service makes the sccache server miss its startup timeout
      # (#1623). A cache problem must never fail the job: build without the wrapper instead.
      - name: Start sccache or fall back to no wrapper
        run: |
          if ! SCCACHE_STARTUP_TIMEOUT=60 sccache --start-server; then
            echo "::warning::sccache server did not start; building without RUSTC_WRAPPER"
            echo "RUSTC_WRAPPER=" >>"$GITHUB_ENV"
          fi
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - if: hashFiles('Cargo.toml') != ''
        run: cargo fmt --check
      - if: hashFiles('Cargo.toml') != ''
        run: cargo check --workspace --all-targets
      - name: Remove Cargo target files
        if: always()
        run: rm -rf -- "$CARGO_TARGET_DIR"
  rust:
    if: ${{ github.event_name == 'workflow_dispatch' || !github.event.pull_request.draft }}
    runs-on: codex-gpui
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      # The runner containers start empty, so a local-disk sccache never hit; use the GitHub cache.
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - run: >
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          build-essential pkg-config clang cmake libssl-dev libzstd-dev
          libfontconfig-dev libfreetype-dev libasound2-dev libxkbcommon-dev
          libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev libxcb1-dev
          libvulkan-dev xvfb
      - uses: mozilla-actions/sccache-action@v0.0.11
      # A slow or unreachable GitHub cache service makes the sccache server miss its startup timeout
      # (#1623). A cache problem must never fail the job: build without the wrapper instead.
      - name: Start sccache or fall back to no wrapper
        run: |
          if ! SCCACHE_STARTUP_TIMEOUT=60 sccache --start-server; then
            echo "::warning::sccache server did not start; building without RUSTC_WRAPPER"
            echo "RUSTC_WRAPPER=" >>"$GITHUB_ENV"
          fi
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      # fmt runs in the quick job. main has no Cargo workspace yet; the checks start once Cargo.toml lands.
      - if: hashFiles('Cargo.toml') != ''
        run: cargo clippy --workspace --all-targets -- -D warnings
      - if: hashFiles('Cargo.toml') != ''
        uses: taiki-e/install-action@nextest
      # nextest does not run doctests; the next step runs them.
      - if: hashFiles('Cargo.toml') != ''
        run: cargo nextest run --workspace --features app/test-support
      - if: hashFiles('Cargo.toml') != ''
        run: cargo test --workspace --doc
      # The primary window must open on the X11 backend: timeout (124) means it stayed up.
      - if: hashFiles('Cargo.toml') != ''
        name: Smoke-open the primary window
        run: |
          cargo build -p app
          rc=0
          stub=$(mktemp -d)
          printf '#!/bin/sh\nexec sleep 3600\n' >"$stub/codex"
          chmod +x "$stub/codex"
          HOME=$(mktemp -d) PATH="$stub:$PATH" timeout 20 xvfb-run -a "$CARGO_TARGET_DIR/debug/codex-gpui" || rc=$?
          [[ $rc -eq 124 ]] || { echo "window did not stay open (exit $rc)" >&2; exit 1; }
      - name: Remove Cargo target files
        if: always()
        run: rm -rf -- "$CARGO_TARGET_DIR"
  windows:
    # GitHub-hosted runner; the self-hosted jobs above stay the required Linux checks.
    if: ${{ github.event_name == 'workflow_dispatch' || !github.event.pull_request.draft }}
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          target: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      # Tests compare patch and file bytes: keep checkouts LF, as on Linux and macOS.
      - run: git config --global core.autocrlf false
      - run: cargo build --locked -p app --target x86_64-pc-windows-msvc
      # Every test target must compile. The unit tests run; the UI replay integration tests under
      # crates/app/tests still use POSIX path and shell-script fixtures, so they stay Unix-only.
      - run: cargo test --locked --workspace --features app/test-support --all-targets --no-run --target x86_64-pc-windows-msvc
      - run: cargo test --locked --no-fail-fast --workspace --features app/test-support --lib --bins --target x86_64-pc-windows-msvc
  macos:
    # Self-hosted Mac (mac-codex-gpui); compile check plus the macOS-guarded app tests (#1510).
    if: ${{ github.event_name == 'workflow_dispatch' || !github.event.pull_request.draft }}
    runs-on: [self-hosted, macOS, mac-codex-gpui]
    timeout-minutes: 60
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The runner PATH lacks Homebrew; opusic-sys needs cmake from there.
      - run: echo "/opt/homebrew/bin" >> "$GITHUB_PATH"
      # shortcut: the full workspace (cmake/opusic-sys) is not built on macOS here; widen when it is fixed.
      - run: cargo check --locked -p textsys -p gpui_macos -p ui
      # Run only the app test targets whose tests return early off macOS (Metal replay), so each really executes here.
      # One target at a time, deleting its binary after the run: ~150 linked test binaries fill the runner disk.
      - name: macOS-guarded app tests
        shell: bash
        run: |
          set -uo pipefail
          log=$(mktemp /tmp/macos-guarded.XXXXXX)
          failed=""
          for f in $(grep -lE 'target_os = "macos"|skip_unless_macos!' crates/app/tests/*.rs); do
            t=$(basename "$f" .rs)
            cargo test --locked -p app --test "$t" -- --test-threads=1 2>&1 | tee -a "$log" || failed="$failed $t"
            rm -f target/debug/deps/"$t"-*
          done
          awk '/^test result/ {p+=$4; f+=$6} END {print "guarded tests passed=" p " failed=" f}' "$log"
          rm -f "$log"
          if [ -n "$failed" ]; then echo "failed targets:$failed"; exit 1; fi
