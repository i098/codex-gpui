[package]
name = "bridge"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
async-channel = "2"
async-lock = "3"
parking_lot = "0.12"
polling = "3"
rustls = { version = "0.23", default-features = false, features = ["std", "ring"] }
rustls-native-certs = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tungstenite = { path = "../../vendor/tungstenite", default-features = false, features = ["handshake", "rustls-tls-native-roots"] }
webpki-roots = "1"

[dev-dependencies]
futures-lite = "2"
log = { version = "0.4", features = ["std"] }
