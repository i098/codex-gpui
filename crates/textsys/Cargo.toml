[package]
name = "textsys"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
gpui.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
anyhow.workspace = true
core-foundation = "0.10"
core-graphics = "0.24"
core-text = "21"
harfbuzz-sys = { version = "0.8", default-features = false, features = ["bundled"] }
objc2 = "0.6"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSResponder", "NSView"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSAttributedString", "NSGeometry", "NSString"] }
parking_lot = "0.12"
raw-window-handle = { version = "0.6", features = ["std"] }

[dev-dependencies]
anyhow.workspace = true
gpui = { workspace = true, features = ["test-support"] }
gpui_platform = { workspace = true, features = ["test-support"] }
image.workspace = true
serde_json = "1"
shapes = { path = "../shapes" }
