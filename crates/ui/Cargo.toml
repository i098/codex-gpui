[package]
name = "ui"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
base64 = "0.22"
bridge = { path = "../bridge" }
chrono = { version = "0.4", default-features = false, features = ["alloc", "clock"] }
gpui.workspace = true
image.workspace = true
parking_lot = "0.12"
pulldown-cmark = { version = "0.13", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shapes = { path = "../shapes" }
syntect = { version = "5.3", default-features = false, features = ["default-syntaxes", "regex-fancy"] }
textsys = { path = "../textsys" }
theme = { path = "../theme" }
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSPasteboard"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSString"] }

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
gpui_platform = { workspace = true, features = ["test-support"] }
