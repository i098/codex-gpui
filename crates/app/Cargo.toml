[package]
name = "app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "codex-gpui: native Codex Desktop in Rust for macOS and Linux, built with GPUI. Drives the real codex app-server."
keywords = ["codex-desktop", "rust", "gpui", "native-app", "codex"]

[features]
test-support = []

[[bin]]
name = "codex-gpui"
path = "src/main.rs"

# Flow harness (docs/flows.md): runs every flow, then fails if any did.
[[test]]
name = "flows"
harness = false

[dependencies]
anyhow.workspace = true
async-channel = "2"
base64 = "0.22"
bridge = { path = "../bridge" }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
chrono-tz = "0.10"
futures-lite = "2"
gpui.workspace = true
glob = "0.3.4"
gpui_platform.workspace = true
http_client = { git = "https://github.com/zed-industries/zed", rev = "3e145061d861ed32bb6a08dad7b03f2b5e455ad8" }
iana-time-zone = "0.1"
image.workspace = true
notify = "8"
pollster = "1.0"
portable-pty = "0.9"
rrule = { path = "../../vendor/rrule", features = ["exrule"] }
regex = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
shlex = "2"
sha2 = "0.10"
tempfile = "3"
toml = "0.8"
theme = { path = "../theme" }
ui = { path = "../ui" }
ureq = "3"
url = "2"
vt100 = "0.15.2"

[target.'cfg(target_os = "linux")'.dependencies]
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }

[target.'cfg(target_os = "windows")'.dependencies]
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
uds_windows = "1.2.1"

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
rustix = { version = "1.1.5", features = ["fs"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSRunningApplication", "NSImage", "NSImageRep", "NSBitmapImageRep"] }
objc2 = "0.6.5"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSGeometry", "NSData", "NSDictionary", "NSString", "NSValue", "NSURL", "NSBundle", "NSError", "NSProcessInfo", "NSUUID"] }
objc2-user-notifications = { version = "0.3.2", default-features = false, features = ["std", "block2", "UNUserNotificationCenter", "UNNotificationSettings"] }
raw-window-handle = "0.6"

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
gpui_platform = { workspace = true, features = ["test-support"] }
parking_lot = "0.12"
parity = { path = "../parity" }
textsys = { path = "../textsys" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
