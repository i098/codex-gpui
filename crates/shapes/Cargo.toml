[package]
name = "shapes"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
gpui.workspace = true

# Chromium's Skia (tools/shapes/skia.sh builds the archive .cargo/config.toml points at).
[target.'cfg(target_os = "macos")'.dependencies]
base64 = "0.22"
image.workspace = true
parking_lot = "0.12"
skia-safe = { version = "=0.153.3", default-features = false, features = ["binary-cache"] }

[dev-dependencies]
anyhow.workspace = true
gpui = { workspace = true, features = ["test-support"] }
gpui_platform = { workspace = true, features = ["test-support"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
textsys = { path = "../textsys" }

# The measurement lab renders on the Mac; build it with `--features lab` (tools/shapes/run.sh).
[features]
lab = []

[[example]]
name = "lab"
required-features = ["lab"]

[[example]]
name = "blur"
required-features = ["lab"]
